[project]
name = "prompt-system-framework"
version = "0.1.0"
description = "Config-driven framework for building and running multi-node prompt systems"
readme = "README.md"
authors = [
  { name = "Prompt System Framework" }
]
requires-python = ">=3.11"
dependencies = [
  "typer[all]>=0.12",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "openai>=1.0.0",
  "rich>=13.7",
  "jinja2>=3.1",
  "python-chess>=1.999"
]

[project.scripts]
psf = "psf.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
