id: "chess_san_move_generator_validated_system"
label: "Chess Move Generator (SAN, Self-Validated)"
version: "0.1.0"
entry_node_id: "propose_move"
benchmark_batch_size: 25

system_input:
  fields:
    position_fen:
      type: string
      required: true
      description: "Board state in Forsyth–Edwards Notation (full FEN, 6 fields)"
    move_notation:
      type: string
      required: false
      description: "Move notation tag (san)"
    move_context:
      type: string
      required: false
      description: "Optional human notes or intent"

system_output:
  fields:
    move_san:
      from: "node.final_response.output.move_san"
    trusted_by_validator:
      from: "node.final_response.output.trusted_by_validator"
    illegal_attempts:
      from: "node.final_response.output.illegal_attempts"
    illegal_moves:
      from: "node.final_response.output.illegal_moves"

nodes:
  - id: "propose_move"
    label: "Generate one SAN move"
    provider: "openai"
    model: "gpt-4o-mini"
    temperature: 0.1
    max_tokens: 256
    max_retries: 2
    instructions: |
      You are playing a chess game and must propose exactly ONE legal move for the side to move.
      Move notation: SAN (Standard Algebraic Notation).
      Requirements:
      - The move must be legal in the exact position.
      - Output must be minified JSON only (no markdown, no code fences).
      - The JSON key must be "move_san".
      - Do not output any move listed under Illegal moves.
      - If unsure, choose a simple developing or improving move that is definitely legal.
    prompt_template: |
      FEN: {{ position_fen }}
      Side to move: {{ "white" if position_fen.split(" ")[1] == "w" else "black" }}
      Move notation: SAN
      Attempt: {{ illegal_attempts + 1 }}
      {% if move_context %}
      Context: {{ move_context }}
      {% endif %}
      {% if illegal_moves and illegal_moves|length > 0 %}
      Illegal moves (do not repeat):
      {% for m in illegal_moves %}
      - {{ m }}
      {% endfor %}
      {% endif %}
      {% if last_illegal_reason %}
      Last illegality reason: {{ last_illegal_reason }}
      {% endif %}

      Respond with minified JSON only:
      {"move_san":"<SAN move>"}
    input_bindings:
      position_fen:
        from: "system.position_fen"
      move_context:
        from: "system.move_context"
        required: false
      illegal_moves:
        from: "node.handle_illegal_move.output.illegal_moves"
        required: false
        default: []
      illegal_attempts:
        from: "runtime.loop_counters.illegal_move_attempts"
        required: false
        default: 0
      last_illegal_reason:
        from: "node.check_legality.output.reason"
        required: false
        default: ""
    output_mode: "structured"
    output_schema:
      type: object
      properties:
        move_san:
          type: string
      required: [move_san]
    routing:
      on_success:
        - next: "check_legality"

  - id: "check_legality"
    label: "Validate SAN legality"
    provider: "openai"
    model: "gpt-4o-mini"
    temperature: 0.0
    max_tokens: 256
    max_retries: 2
    instructions: |
      You are a strict chess arbiter.
      Determine whether the provided SAN move is legal in the exact FEN position.
      Consider all rules: side to move, check, pins, castling, en passant, promotion, etc.
    prompt_template: |
      FEN: {{ position_fen }}
      Side to move: {{ "white" if position_fen.split(" ")[1] == "w" else "black" }}
      MOVE (SAN): {{ move_san }}

      Respond with minified JSON only:
      {"is_legal":true|false,"reason":"<short explanation>"}
    input_bindings:
      position_fen:
        from: "system.position_fen"
      move_san:
        from: "node.propose_move.output.move_san"
    output_mode: "structured"
    output_schema:
      type: object
      properties:
        is_legal:
          type: boolean
        reason:
          type: string
      required: [is_legal, reason]
    routing:
      on_success:
        - condition: "output.is_legal == true"
          next: "final_response"
        - condition: "output.is_legal == false"
          next: "handle_illegal_move"

  - id: "handle_illegal_move"
    label: "Accumulate illegal moves and retry"
    provider: "openai"
    model: "gpt-4o-mini"
    temperature: 0.0
    max_tokens: 256
    max_retries: 2
    instructions: |
      Maintain a running list of illegal move attempts.
      Append the current move to the prior list, preserving order.
      Output minified JSON only.
    prompt_template: |
      Prior illegal moves: {{ prior_illegal_moves }}
      New illegal move to append: {{ new_illegal_move }}
      Why it was illegal: {{ reason }}

      Respond with minified JSON only:
      {"illegal_moves":["..."]}
    input_bindings:
      prior_illegal_moves:
        from: "node.handle_illegal_move.output.illegal_moves"
        required: false
        default: []
      new_illegal_move:
        from: "node.propose_move.output.move_san"
      reason:
        from: "node.check_legality.output.reason"
    output_mode: "structured"
    output_schema:
      type: object
      properties:
        illegal_moves:
          type: array
          items:
            type: string
      required: [illegal_moves]
    loop_control:
      counter_key: "illegal_move_attempts"
      max_iterations: 5
      loop_target_node: "propose_move"
      exit_on_success: false
    routing:
      on_loop_exhausted:
        - next: "force_accept_move"

  - id: "force_accept_move"
    label: "Generate final move (force accept)"
    provider: "openai"
    model: "gpt-4o-mini"
    temperature: 0.1
    max_tokens: 256
    max_retries: 2
    instructions: |
      You already produced 5 illegal move attempts.
      Propose ONE move in SAN anyway; it does NOT need to be legal, but try your best.
      Output must be minified JSON only with key "move_san".
      Do not repeat moves listed under Illegal moves.
    prompt_template: |
      FEN: {{ position_fen }}
      Side to move: {{ "white" if position_fen.split(" ")[1] == "w" else "black" }}
      Move notation: SAN
      Attempts so far (illegal): {{ illegal_attempts }}
      {% if move_context %}
      Context: {{ move_context }}
      {% endif %}
      Illegal moves (do not repeat):
      {% for m in illegal_moves %}
      - {{ m }}
      {% endfor %}

      Respond with minified JSON only:
      {"move_san":"<SAN move>"}
    input_bindings:
      position_fen:
        from: "system.position_fen"
      move_context:
        from: "system.move_context"
        required: false
      illegal_moves:
        from: "node.handle_illegal_move.output.illegal_moves"
        required: false
        default: []
      illegal_attempts:
        from: "runtime.loop_counters.illegal_move_attempts"
        required: false
        default: 5
    output_mode: "structured"
    output_schema:
      type: object
      properties:
        move_san:
          type: string
      required: [move_san]
    routing:
      on_success:
        - next: "final_response"

  - id: "final_response"
    label: "Finalize move selection"
    provider: "openai"
    model: "gpt-4o-mini"
    temperature: 0.0
    max_tokens: 256
    max_retries: 2
    instructions: |
      Produce the final system output.
      If a move was accepted as legal by the validator, trusted_by_validator must be true.
      If we exhausted illegal retries and had to force-accept a move, trusted_by_validator must be false.
      Output minified JSON only.
    prompt_template: |
      Candidate from validated path: {{ validated_move }}
      Candidate from forced path: {{ forced_move }}
      Illegal attempts: {{ illegal_attempts }}
      Illegal moves: {{ illegal_moves }}

      Rules:
      - If forced_move is non-empty, output forced_move and trusted_by_validator=false.
      - Else output validated_move and trusted_by_validator=true.

      Respond with minified JSON only:
      {"move_san":"...","trusted_by_validator":true,"illegal_attempts":0,"illegal_moves":["..."]}
    input_bindings:
      validated_move:
        from: "node.propose_move.output.move_san"
        required: false
        default: ""
      forced_move:
        from: "node.force_accept_move.output.move_san"
        required: false
        default: ""
      illegal_attempts:
        from: "runtime.loop_counters.illegal_move_attempts"
        required: false
        default: 0
      illegal_moves:
        from: "node.handle_illegal_move.output.illegal_moves"
        required: false
        default: []
    output_mode: "structured"
    output_schema:
      type: object
      properties:
        move_san:
          type: string
        trusted_by_validator:
          type: boolean
        illegal_attempts:
          type: number
        illegal_moves:
          type: array
          items:
            type: string
      required: [move_san, trusted_by_validator, illegal_attempts, illegal_moves]
    terminal: true
