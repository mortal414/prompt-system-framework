id: "chess_move_system"
label: "Chess Move Proposal + Validation"
version: "0.1.0"
entry_node_id: "propose_move"

benchmark_batch_size: 100

system_input:
  fields:
    position_fen:
      type: string
      required: true
    game_context:
      type: string
      required: false

system_output:
  fields:
    move_san:
      from: "node.final_response.output.move_san"
    rationale:
      from: "node.final_response.output.rationale"
    final_message:
      from: "node.final_response.output.final_message"

nodes:
  - id: "propose_move"
    label: "Propose candidate move"
    provider: "openai"
    model: "gpt-4o-mini"
    temperature: 0.2
    max_tokens: 512
    instructions: |
      You are a chess analyst helping a user play a thoughtful game.
    prompt_template: |
      Position (FEN): {{ position_fen }}
      {% if game_context %}Game context: {{ game_context }}{% endif %}

      Provide exactly one candidate move in SAN notation with a short rationale.
    input_bindings:
      position_fen:
        from: "system.position_fen"
      game_context:
        from: "system.game_context"
        required: false
    output_mode: "raw"
    routing:
      on_success:
        - next: "parse_proposed_move"

  - id: "parse_proposed_move"
    label: "Parse SAN move"
    provider: "openai"
    model: "gpt-4o-mini"
    temperature: 0.2
    max_tokens: 512
    instructions: |
      Convert the raw assistant text into a strict JSON object.
    prompt_template: |
      Raw assistant text:
      {{ proposal_text }}

      Respond with JSON matching this shape:
      {
        "move_san": "<SAN move>",
        "rationale": "<one sentence>",
        "confidence": <number between 0 and 1>
      }
    input_bindings:
      proposal_text:
        from: "node.propose_move.raw_output"
    output_mode: "structured"
    output_schema:
      type: object
      properties:
        move_san:
          type: string
        rationale:
          type: string
        confidence:
          type: number
      required: [move_san, rationale]
    routing:
      on_success:
        - next: "validate_move"

  - id: "validate_move"
    label: "Validate SAN legality"
    provider: "openai"
    model: "gpt-4o-mini"
    temperature: 0.2
    max_tokens: 512
    instructions: |
      Check whether the SAN move is legal in the provided FEN position.
    prompt_template: |
      Position: {{ position_fen }}
      Candidate move: {{ move_san }}

      Respond with JSON:
      {
        "is_valid": true or false,
        "reason": "<short explanation>"
      }
    input_bindings:
      position_fen:
        from: "system.position_fen"
      move_san:
        from: "node.parse_proposed_move.output.move_san"
    output_mode: "structured"
    output_schema:
      type: object
      properties:
        is_valid:
          type: boolean
        reason:
          type: string
      required: [is_valid]
    routing:
      on_success:
        - condition: "output.is_valid == true"
          next: "final_response"
        - condition: "output.is_valid == false"
          next: "handle_invalid_move"

  - id: "handle_invalid_move"
    label: "Handle invalid move"
    provider: "openai"
    model: "gpt-4o-mini"
    temperature: 0.2
    max_tokens: 512
    instructions: |
      Summarize why the move failed validation and encourage a new attempt.
    prompt_template: |
      Invalid reason: {{ invalid_reason }}
      Attempts so far: {{ attempt_count }}
      Provide JSON with "message" (short summary) and "advice" (one sentence guidance).
    input_bindings:
      invalid_reason:
        from: "node.validate_move.output.reason"
        required: false
      attempt_count:
        from: "runtime.loop_counters.invalid_move_attempts"
        required: false
        default: 0
    output_mode: "structured"
    output_schema:
      type: object
      properties:
        message:
          type: string
        advice:
          type: string
      required: [message]
    loop_control:
      counter_key: "invalid_move_attempts"
      max_iterations: 3
      loop_target_node: "propose_move"
      exit_on_success: false
    routing:
      on_loop_exhausted:
        - next: "final_response"
      on_success:
        - next: "propose_move"

  - id: "final_response"
    label: "Final reply"
    provider: "openai"
    model: "gpt-4o-mini"
    temperature: 0.2
    max_tokens: 512
    instructions: |
      Craft the final response for the user.
      If the move validated, celebrate it and explain the rationale.
      If validation never passed, explain that no legal move was found and summarize the last validation error.
      Respond with JSON:
      {
        "move_san": "<best move or empty string>",
        "rationale": "<short reasoning or failure summary>",
        "final_message": "<user-facing reply>"
      }
    prompt_template: |
      Latest candidate move: {{ move_san|default("(none)") }}
      Parsed rationale: {{ rationale|default("(none)") }}
      Validation result: {{ is_valid|default(false) }}
      Validation reason: {{ validation_reason|default("(not available)") }}
      Invalid summary: {{ invalid_summary|default("(not provided)") }}
    input_bindings:
      move_san:
        from: "node.parse_proposed_move.output.move_san"
        required: false
      rationale:
        from: "node.parse_proposed_move.output.rationale"
        required: false
      is_valid:
        from: "node.validate_move.output.is_valid"
        required: false
      validation_reason:
        from: "node.validate_move.output.reason"
        required: false
      invalid_summary:
        from: "node.handle_invalid_move.output.message"
        required: false
    output_mode: "structured"
    output_schema:
      type: object
      properties:
        move_san:
          type: string
        rationale:
          type: string
        final_message:
          type: string
      required: [final_message]
    terminal: true
