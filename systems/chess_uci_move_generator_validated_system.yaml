id: "chess_uci_move_generator_validated_system"
label: "Chess Move Generator (UCI, Validated)"
version: "0.2.0"
entry_node_id: "generate_move"
benchmark_batch_size: 25

system_input:
  fields:
    position_fen:
      type: string
      required: true
      description: "Board state in Forsyth–Edwards Notation (full FEN, 6 fields)"
    move_notation:
      type: string
      required: false
      description: "Move notation tag (uci)"
    illegal_moves:
      type: array
      required: false
      description: "Prior attempted UCI moves that should be avoided"
    attempt:
      type: number
      required: false
      description: "Attempt counter (1-indexed)"
    move_context:
      type: string
      required: false
      description: "Optional human notes or intent"

system_output:
  fields:
    move_uci:
      from: "node.parse_legality_result.output.move_uci"
    is_legal:
      from: "node.parse_legality_result.output.is_legal"
    verdict:
      from: "node.parse_legality_result.output.verdict"
    reason:
      from: "node.parse_legality_result.output.reason"
    trusted_by_validator:
      from: "node.parse_legality_result.output.trusted_by_validator"
    illegal_attempts:
      from: "node.parse_legality_result.output.illegal_attempts"
    illegal_moves:
      from: "node.parse_legality_result.output.illegal_moves"

nodes:
  - id: "generate_move"
    label: "Generate a UCI move (raw)"
    provider: "openai"
    model: "gpt-4o-mini"
    temperature: 0.1
    max_tokens: 64
    max_retries: 2
    instructions: |
      You are playing a chess game and must propose exactly ONE legal move for the side to move.
      Move notation: UCI (coordinate notation).

      UCI format:
      - Normal move: <from><to> (example: e2e4).
      - Promotion: add one letter (q, r, b, n) in lowercase (example: e7e8q).
      - Castling is the king move: e1g1, e1c1, e8g8, e8c8.
      - Use lowercase for squares and promotion piece; do not include SAN symbols (no "x", "+", "#", "=", or "O-O").

      Requirements:
      - The move must be legal in the exact position (respect side to move, check, pins, castling rights, en passant, promotion).
      - Do not output any move listed under Illegal moves.
      - Output exactly one UCI move string with no surrounding whitespace (no JSON, no extra text).
      - The UCI move string must be length 4 (normal) or 5 (promotion).
      - If unsure, prefer a quiet developing move, but it still must be legal.
    prompt_template: |
      FEN: {{ position_fen }}
      Side to move: {{ "white" if position_fen.split(" ")[1] == "w" else "black" }}
      Castling rights: {{ position_fen.split(" ")[2] }}
      En passant target: {{ position_fen.split(" ")[3] }}
      Move notation: UCI
      {% if attempt %}
      Attempt: {{ attempt }}
      {% endif %}
      {% if move_context %}
      Context: {{ move_context }}
      {% endif %}
      {% if illegal_moves and illegal_moves|length > 0 %}
      Illegal moves (do not repeat):
      {% for m in illegal_moves %}
      - {{ m }}
      {% endfor %}
      {% endif %}

      Respond with one UCI move string only (example: e2e4).
    input_bindings:
      position_fen:
        from: "system.position_fen"
      move_context:
        from: "system.move_context"
        required: false
      illegal_moves:
        from: "system.illegal_moves"
        required: false
        default: []
      attempt:
        from: "system.attempt"
        required: false
    output_mode: "raw"
    routing:
      on_success:
        - next: "parse_move"

  - id: "parse_move"
    label: "Parse + normalize UCI move"
    provider: "openai"
    model: "gpt-4o-mini"
    temperature: 0.0
    max_tokens: 128
    max_retries: 2
    instructions: |
      Extract exactly one UCI move from the raw text and normalize it.

      Rules:
      - Output minified JSON only (no markdown, no code fences).
      - The JSON key must be "move_uci".
      - move_uci must be lowercase and contain only [a-h][1-8][a-h][1-8] plus optional promotion [qrbn].
      - move_uci must be length 4 (normal) or 5 (promotion).
      - If multiple candidates exist, choose the first plausible UCI move.
      - If no plausible UCI move exists, output an empty string "".
    prompt_template: |
      Raw candidate:
      {{ raw_candidate }}

      Respond with minified JSON only:
      {"move_uci":"e2e4"}
    input_bindings:
      raw_candidate:
        from: "node.generate_move.raw_output"
    output_mode: "structured"
    output_schema:
      type: object
      properties:
        move_uci:
          type: string
      required: [move_uci]
    routing:
      on_success:
        - next: "check_legality"

  - id: "check_legality"
    label: "Validate UCI legality"
    use_system: "chess_uci_legal_check_yn_system.yaml"
    input_bindings:
      position_fen:
        from: "system.position_fen"
      candidate_move:
        from: "node.parse_move.output.move_uci"
      move_context:
        from: "system.move_context"
        required: false
      move_notation:
        value: "uci"
    routing:
      on_success:
        - next: "parse_legality_result"

  - id: "parse_legality_result"
    label: "Parse legality result (trusted)"
    provider: "openai"
    model: "gpt-4o-mini"
    temperature: 0.0
    max_tokens: 256
    max_retries: 2
    instructions: |
      You are a strict formatter.
      Trust the validator output and produce the final system output JSON.

      Rules:
      - Output minified JSON only (no markdown, no code fences).
      - move_uci must be the candidate_move as provided.
      - is_legal, verdict, reason must come from the validator output.
      - trusted_by_validator must equal is_legal (there is no forced-accept path).
      - illegal_moves must equal prior_illegal_moves, plus candidate_move appended ONLY if is_legal is false and candidate_move is non-empty and not already present.
      - illegal_attempts must equal the length of illegal_moves.
    prompt_template: |
      Candidate move: {{ candidate_move }}
      Validator: is_legal={{ is_legal }}, verdict={{ verdict }}, reason={{ reason }}
      Prior illegal moves: {{ prior_illegal_moves }}

      Respond with minified JSON only:
      {"move_uci":"...","is_legal":true,"verdict":"Y","reason":"...","trusted_by_validator":true,"illegal_attempts":0,"illegal_moves":["..."]}
    input_bindings:
      candidate_move:
        from: "node.parse_move.output.move_uci"
      is_legal:
        from: "node.check_legality.output.is_legal"
      verdict:
        from: "node.check_legality.output.verdict"
      reason:
        from: "node.check_legality.output.reason"
      prior_illegal_moves:
        from: "system.illegal_moves"
        required: false
        default: []
    output_mode: "structured"
    output_schema:
      type: object
      properties:
        move_uci:
          type: string
        is_legal:
          type: boolean
        verdict:
          type: string
          enum: ["Y", "N"]
        reason:
          type: string
        trusted_by_validator:
          type: boolean
        illegal_attempts:
          type: number
        illegal_moves:
          type: array
          items:
            type: string
      required: [move_uci, is_legal, verdict, reason, trusted_by_validator, illegal_attempts, illegal_moves]
    terminal: true
