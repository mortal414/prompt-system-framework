id: "chess_san_move_generator_system"
label: "Chess Move Generator (SAN)"
version: "0.1.0"
entry_node_id: "generate_move"

system_input:
  fields:
    position_fen:
      type: string
      required: true
      description: "Board state in Forsyth–Edwards Notation (full FEN, 6 fields)"
    move_notation:
      type: string
      required: false
      description: "Move notation tag (san)"
    illegal_moves:
      type: array
      required: false
      description: "Prior attempted SAN moves that should be avoided"
    attempt:
      type: number
      required: false
      description: "Attempt counter (1-indexed)"

system_output:
  fields:
    move_san:
      from: "node.generate_move.output.move_san"

nodes:
  - id: "generate_move"
    label: "Propose one SAN move"
    provider: "openai"
    model: "gpt-4o-mini"
    temperature: 0.1
    max_tokens: 256
    max_retries: 2
    instructions: |
      You are playing a chess game and must propose exactly ONE legal move for the side to move.
      Move notation: SAN (Standard Algebraic Notation).
      Requirements:
      - The move must be legal in the exact position.
      - Output must be minified JSON only (no markdown, no code fences).
      - The JSON key must be "move_san".
      - Do not output any move listed under Illegal moves.
      - If unsure, choose a simple developing or improving move that is definitely legal.
    prompt_template: |
      FEN: {{ position_fen }}
      Side to move: {{ "white" if position_fen.split(" ")[1] == "w" else "black" }}
      Move notation: SAN
      {% if attempt %}
      Attempt: {{ attempt }}
      {% endif %}
      {% if illegal_moves and illegal_moves|length > 0 %}
      Illegal moves (do not repeat):
      {% for m in illegal_moves %}
      - {{ m }}
      {% endfor %}
      {% endif %}

      Respond with minified JSON only:
      {"move_san":"<SAN move>"}
    input_bindings:
      position_fen:
        from: "system.position_fen"
      illegal_moves:
        from: "system.illegal_moves"
        required: false
        default: []
      attempt:
        from: "system.attempt"
        required: false
    output_mode: "structured"
    output_schema:
      type: object
      properties:
        move_san:
          type: string
      required: [move_san]
    terminal: true
